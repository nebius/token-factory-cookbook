[project]
name = "openenv-prompt-optimization"
version = "0.1.0"
description = "Prompt Optimization with OpenEnv and Open Models on Nebius Token Factory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openenv==0.4.1",
    "fastmcp>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.24.0",
    "httpx>=0.27.0",
    "openai>=1.60.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.16.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # long strings in prompts and tables

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
