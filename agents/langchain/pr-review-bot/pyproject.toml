[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-pr-reviewer"
version = "0.1.0"
description = "GitHub pull-request reviewer powered by LangChain Deep Agents and Nebius."
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-openai>=1,<2",
    "pydantic-settings>=2.7,<3",
    "PyJWT[crypto]>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
