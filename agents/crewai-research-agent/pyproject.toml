[project]
name = "token-factory-crewai-research-agent"
version = "0.2.0"
description = "CrewAI multi-agent and tool recipe for Nebius Token Factory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai>=1.15.3,<2",
    "python-dotenv>=1.2.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
