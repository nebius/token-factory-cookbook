# In-cluster HTTP probe used for bounded checks. It reaches only Services in its own namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  labels:
    app.kubernetes.io/name: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: probe
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: probe
          image: ${PROBE_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "storefront.probe"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  labels:
    app.kubernetes.io/name: probe
spec:
  selector:
    app.kubernetes.io/name: probe
  ports:
    - name: http
      port: 80
      targetPort: http
