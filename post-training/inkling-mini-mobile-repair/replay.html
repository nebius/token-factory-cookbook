<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile landing-page repairs</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f5ee;color:#172f2b;font-family:system-ui,sans-serif}main{max-width:1430px;margin:auto;padding:24px clamp(14px,3vw,48px) 44px}header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #a2ada4;padding-bottom:15px;gap:12px;flex-wrap:wrap}h1{font:500 clamp(25px,4vw,53px)/1 Georgia,serif;margin:8px 0}.filters{display:flex;gap:16px;align-items:end;flex-wrap:wrap;margin:20px 0 4px}label{display:grid;gap:5px;font-size:12px;font-weight:650}select{padding:8px 10px;border:1px solid #93a199;background:white;color:inherit;font:inherit;font-size:15px}.ticket{max-width:90ch;font-size:16px;line-height:1.55;margin:14px 0 20px}.panes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.pane{min-width:0;background:#fff;border:1px solid #a3ada5}.cap{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;padding:12px;gap:4px}h2{font-size:16px;margin:0}.pass{color:#195c3d}.fail{color:#853a27}.state{font-size:12px;font-weight:650}.view{position:relative;overflow:hidden;background:#e4e9e3;border-block:1px solid #a3ada5}.view iframe{border:0;transform-origin:top left;display:block;background:white}.detail{padding:10px 13px;font-size:12px;line-height:1.6}.detail p{margin:2px 0 8px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;color:#123c32}#position{font-size:13px}@media(max-width:800px){.panes{grid-template-columns:1fr}.pane{max-width:450px}.view{max-height:640px}}
</style><main><header><h1>Mobile landing-page repairs</h1><span id="position"></span></header><div class="filters"><label>Test page<select id="case"></select></label><label>Viewport<select id="width"><option>320</option><option selected>375</option><option>430</option><option>1024</option><option>1280</option></select></label></div><p class="ticket" id="ticket"></p><div class="panes" id="panes"></div></main><script type="application/json" id="data">__CASES__</script><script>
const records=JSON.parse(document.querySelector('#data').textContent),cases=document.querySelector('#case'),width=document.querySelector('#width'),panes=document.querySelector('#panes');
const firstWin=records.find(r=>r.grades.tuned.pass&&!r.grades.base.pass)||records[0];
for(const r of records)cases.add(new Option((r.split==='primary'?'Primary':'Transfer')+' · '+r.id+' · '+r.family,r.id));cases.value=firstWin.id;
const arms=[['broken','Original page'],['base','Base Mini'],['tuned','Kimi-trained Mini']];
function fit(){for(const box of panes.querySelectorAll('.view')){const w=Number(width.value),scale=Math.min(1,box.clientWidth/w),h=w>500?840:740,f=box.firstChild;f.style.width=w+'px';f.style.height=h+'px';f.style.transform='scale('+scale+')';box.style.height=(h*scale)+'px'}}
function paint(){
 const r=records.find(x=>x.id===cases.value),w=Number(width.value);
 document.querySelector('#ticket').textContent=r.ticket;document.querySelector('#position').textContent=records.length+' evaluated pages';panes.replaceChildren();
 for(const [arm,label] of arms){const g=r.grades[arm],outer=document.createElement('article');outer.className='pane';outer.innerHTML='<div class="cap"><h2></h2><span class="state"></span></div><div class="view"><iframe sandbox="" loading="eager"></iframe></div><div class="detail"><p></p><details><summary>Applied CSS</summary><pre></pre></details></div>';outer.querySelector('h2').textContent=label;const state=outer.querySelector('.state');state.textContent=g.pass?'Pass at all five widths':'Fails at least one check';state.classList.add(g.pass?'pass':'fail');let failing=w>500?(g.desktop_unchanged?[]:['desktop preservation']):Object.entries(g.mobile[w]).filter(([,v])=>!v).map(([k])=>k);outer.querySelector('.detail p').textContent=failing.length?'At '+w+' px · '+failing.join(', '):'At '+w+' px · all checks passed';outer.querySelector('pre').textContent=r.patches[arm]||'Original stylesheet';let frame=outer.querySelector('iframe');frame.title=label+' — '+r.family;frame.srcdoc=r.html.replace('</style>','</style><style>'+r.patches[arm].replace(/<\/style/gi,'')+'</style>');panes.append(outer)}
 fit()
}cases.onchange=width.onchange=paint;window.addEventListener('resize',fit);paint();
</script></html>
