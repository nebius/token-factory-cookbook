name: API contract checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/responses/requirements.txt
      - name: Install API example dependencies
        run: python -m pip install -r api/responses/requirements.txt
      - name: Reject stale API hosts and discontinued model examples
        run: python .github/scripts/check_api_contracts.py
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Test the stateless Responses example
        run: python -m unittest discover -s api/responses -p 'test_*.py' -v
