name: Comparing models recipe

on:
  pull_request:
    paths:
      - 'api/comparing-models/**'
      - '.github/workflows/comparing-models.yml'
  push:
    branches: [main]
    paths:
      - 'api/comparing-models/**'
      - '.github/workflows/comparing-models.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r api/comparing-models/requirements.txt
      - run: python api/comparing-models/compare_models.py --help
      - run: python -m unittest discover -s api/comparing-models -p 'test_*.py'
