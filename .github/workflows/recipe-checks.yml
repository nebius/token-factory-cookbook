name: Recipe checks

on:
  pull_request:
    paths:
      - 'agents/kubetrace-ai/**'
      - 'agents/mastra/opencrewbot/**'
      - 'agents/mastra/openduet/**'
      - 'apps/splitter-lite/**'
      - 'apps/sketch-to-walkthrough/**'
      - 'apps/paper-to-interactive-explainer/**'
      - 'apps/napkin-to-3d-print/**'
      - 'apps/image-to-3d/**'
      - 'post-training/gemma-4-agentic-coding/**'
      - '.github/workflows/recipe-checks.yml'
  push:
    branches: [main]
    paths:
      - 'agents/kubetrace-ai/**'
      - 'agents/mastra/opencrewbot/**'
      - 'agents/mastra/openduet/**'
      - 'apps/splitter-lite/**'
      - 'apps/sketch-to-walkthrough/**'
      - 'apps/paper-to-interactive-explainer/**'
      - 'apps/napkin-to-3d-print/**'
      - 'apps/image-to-3d/**'
      - 'post-training/gemma-4-agentic-coding/**'
      - '.github/workflows/recipe-checks.yml'

permissions:
  contents: read

concurrency:
  group: recipe-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kubetrace:
    name: KubeTrace unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/kubetrace-ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -q
      - run: uvx pip-audit --path .venv/lib/python3.13/site-packages --skip-editable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: agents/kubetrace-ai/apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: agents/kubetrace-ai/apps/web
      - run: pnpm build && pnpm typecheck
        working-directory: agents/kubetrace-ai/apps/web
      - run: pnpm audit --prod --audit-level=high
        working-directory: agents/kubetrace-ai/apps/web

  splitter:
    name: Splitter tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/splitter-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/splitter-lite/package-lock.json
      - run: npm ci
      - run: npm test && npm run typecheck && npm run build
      - run: npm audit --omit=dev --audit-level=high

  opencrewbot:
    name: OpenCrewBot tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/mastra/opencrewbot
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: agents/mastra/opencrewbot/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm typecheck && pnpm lint && pnpm build
      - run: pnpm audit --prod --audit-level=high

  openduet:
    name: OpenDuet tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/mastra/openduet
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: agents/mastra/openduet/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm typecheck && pnpm lint && pnpm build
      - run: pnpm audit --prod --audit-level=high

  sketch-to-walkthrough:
    name: Sketch to Walkthrough tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sketch-to-walkthrough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/sketch-to-walkthrough/package-lock.json
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  kimi-python-apps:
    name: ${{ matrix.app }} offline tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [paper-to-interactive-explainer, napkin-to-3d-print]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -v
      - run: uvx pip-audit --path .venv/lib/python3.12/site-packages --skip-editable

  image-to-3d:
    name: Image to 3D server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/image-to-3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  gemma-4-agentic-coding:
    name: Gemma 4 agentic coding offline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: post-training/gemma-4-agentic-coding
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run python -m pytest -q -p no:cacheprovider
      - run: uvx pip-audit --path .venv/lib/python3.12/site-packages --skip-editable
