[project]
name = "pantry"
version = "0.1.0"
description = "Group grocery agent for shared homes on Nebius Token Factory (Kimi K3.1 Pro), with an MCP server for each member's own agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.10,<2",
    "httpx>=0.27",
    "pymysql>=1.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
