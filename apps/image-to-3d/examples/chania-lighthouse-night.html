function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}

function makeSky(){
  const c=document.createElement('canvas');
  c.width=1024;c.height=512;
  const x=c.getContext('2d'),r=mulberry32(73);
  const g=x.createLinearGradient(0,0,0,512);
  g.addColorStop(0,'#050d18');
  g.addColorStop(.58,'#102536');
  g.addColorStop(1,'#354958');
  x.fillStyle=g;x.fillRect(0,0,1024,512);
  for(let i=0;i<170;i++){
    const px=r()*1024,py=r()*345,rad=.35+r()*1.05;
    x.fillStyle=`rgba(215,232,248,${.22+r()*.68})`;
    x.beginPath();x.arc(px,py,rad,0,Math.PI*2);x.fill();
  }
  const mg=x.createRadialGradient(805,100,4,805,100,92);
  mg.addColorStop(0,'rgba(202,224,235,.3)');
  mg.addColorStop(.28,'rgba(164,199,220,.12)');
  mg.addColorStop(1,'rgba(120,160,190,0)');
  x.fillStyle=mg;x.fillRect(710,5,190,190);
  x.fillStyle='#d8e2df';x.beginPath();x.arc(805,100,22,0,Math.PI*2);x.fill();
  x.fillStyle='rgba(80,105,118,.13)';
  [[798,94,6],[813,106,4],[801,112,3]].forEach(v=>{
    x.beginPath();x.arc(v[0],v[1],v[2],0,Math.PI*2);x.fill();
  });
  const puff=(px,py,rad,a)=>{
    const q=x.createRadialGradient(px,py,0,px,py,rad);
    q.addColorStop(0,`rgba(135,160,178,${a})`);
    q.addColorStop(.55,`rgba(93,123,145,${a*.65})`);
    q.addColorStop(1,'rgba(50,75,95,0)');
    x.fillStyle=q;x.fillRect(px-rad,py-rad,rad*2,rad*2);
  };
  [[170,185,1.2],[330,215,1],[890,205,1.25]].forEach(([px,py,s])=>{
    for(let i=0;i<8;i++)puff(px+(i-3.5)*31*s,py+Math.sin(i*1.7)*14*s,(62+(i%3)*17)*s,.1);
  });
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

function stoneTexture(palette,mortar,rows,cols,seed,rx=1,ry=1){
  const r=mulberry32(seed),c=document.createElement('canvas');
  c.width=c.height=512;
  const x=c.getContext('2d');
  x.fillStyle=mortar;x.fillRect(0,0,512,512);
  const rh=512/rows;
  for(let row=0;row<rows;row++){
    let xx=row%2?-512/cols*.45:0;
    while(xx<512){
      const bw=512/cols*(.78+r()*.45);
      x.fillStyle=palette[(r()*palette.length)|0];
      x.fillRect(xx+1.5,row*rh+1.5,bw-3,rh-3);
      x.strokeStyle='rgba(255,241,211,.1)';
      x.strokeRect(xx+3,row*rh+3,bw-6,rh-6);
      xx+=bw;
    }
  }
  for(let i=0;i<1900;i++){
    x.fillStyle=r()>.5?'rgba(255,244,215,.08)':'rgba(30,28,25,.09)';
    const s=.5+r()*2;x.fillRect(r()*512,r()*512,s,s);
  }
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(rx,ry);
  t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());
  return t;
}

function part(geo,mat,x,y,z,parent=scene){
  const m=new THREE.Mesh(geo,mat);

}
function roundedShape(w,d,r){
  const s=new THREE.Shape();
  s.moveTo(-w/2+r,-d/2);s.lineTo(w/2-r,-d/2);
  s.quadraticCurveTo(w/2,-d/2,w/2,-d/2+r);s.lineTo(w/2,d/2-r);
  s.quadraticCurveTo(w/2,d/2,w/2-r,d/2);s.lineTo(-w/2+r,d/2);
  s.quadraticCurveTo(-w/2,d/2,-w/2,d/2-r);s.lineTo(-w/2,-d/2+r);
  s.quadraticCurveTo(-w/2,-d/2,-w/2+r,-d/2);s.closePath();return s;
}
function slab(w,h,d,r,mat,y){
  const b=Math.min(.045,h*.15);
  const g=new THREE.ExtrudeGeometry(roundedShape(w,d,r),{
    depth:h,steps:1,curveSegments:10,bevelEnabled:true,
    bevelSegments:2,bevelSize:b,bevelThickness:b
  });
  g.rotateX(Math.PI/2);g.translate(0,h/2,0);
  return part(g,mat,0,y,0);
}
function arch(w,h,mat){
  const r=w/2,s=new THREE.Shape();
  s.moveTo(-r,-h/2);s.lineTo(r,-h/2);s.lineTo(r,h/2-r);
  s.absarc(0,h/2-r,r,0,Math.PI,false);s.lineTo(-r,-h/2);
  return new THREE.Mesh(new THREE.ShapeGeometry(s,8),mat);
}

const waterMat=new THREE.ShaderMaterial({
  uniforms:{
    uTime:{value:0},uBeamDir:{value:new THREE.Vector2(1,0)},uLamp:{value:new THREE.Vector2()},
    uDeep:{value:new THREE.Color('#071521')},uMid:{value:new THREE.Color('#152a39')},
    uSky:{value:new THREE.Color('#47647a')},uWarm:{value:new THREE.Color('#e2b66f')}
  },
  vertexShader:`
    uniform float uTime;varying vec2 vP;
    void main(){
      vP=position.xy;vec3 p=position;
      p.z+=sin(p.x*2.4+uTime*1.1)*.018;
      p.z+=sin(p.y*3.1-uTime*.8)*.014;
      p.z+=sin((p.x+p.y)*5.0+uTime*1.6)*.006;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
    }`,
  fragmentShader:`
    uniform float uTime;uniform vec2 uBeamDir,uLamp;
    uniform vec3 uDeep,uMid,uSky,uWarm;varying vec2 vP;
    float sdRound(vec2 p,vec2 b,float r){
      vec2 q=abs(p)-b+vec2(r);
      return min(max(q.x,q.y),0.0)+length(max(q,vec2(0.0)))-r;
    }
    void main(){
      if(sdRound(vP,vec2(8.3,5.8),.72)>0.0)discard;
      float a=.5+.5*sin(vP.x*3.2+vP.y*1.4+uTime*1.2);
      float b=.5+.5*sin(vP.y*5.4-vP.x*1.8-uTime*1.45);
      float ripple=pow(max(0.0,sin(vP.y*15.0+sin(vP.x*4.0)+uTime*2.0)),9.0);
      vec3 col=mix(uDeep,uMid,.22+.34*a+.12*b);
      col=mix(col,uSky,ripple*.28);
      float reflection=exp(-abs(vP.x+1.45)*1.05)*(1.0-smoothstep(-5.2,.2,vP.y));
      float broken=pow(max(0.0,sin(vP.y*18.0+sin(vP.x*7.0)+uTime*2.2)),10.0);
      col=mix(col,uWarm,reflection*broken*.68);
      vec2 rel=vP-uLamp,dir=normalize(uBeamDir);
      float along=dot(rel,dir),side=abs(rel.x*dir.y-rel.y*dir.x);
      float width=.22+max(along,0.0)*.1;
      float pool=exp(-side*side/max(.05,width*width))*smoothstep(0.0,1.2,along)*(1.0-smoothstep(5.0,11.0,along));
      col=mix(col,uWarm,clamp(pool*(.08+ripple*.3),0.0,.42));
      gl_FragColor=vec4(col,1.0);
    }`
});

hill.scale.set(4.45,.72,1.25);
const hill2=part(new THREE.SphereGeometry(1,20,10),new THREE.MeshStandardMaterial({color:0x4b5756,roughness:1,flatShading:true}),6.2,.08,-4.5);
hill2.scale.set(2.2,.55,.9);

const houses=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9}),26);
const roofs=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9}),26);
houses.castShadow=houses.receiveShadow=true;roofs.castShadow=roofs.receiveShadow=true;
const houseColors=['#b9c0bc','#aeb8b7','#c9cec6','#969f9e'],houseData=[];
let n=0;
while(n<26){
  const x=.1+rand()*7.25,z=-4.85+rand()*1.2;
  const dx=(x-3.5)/4.45,dz=(z+4.25)/1.25,inside=1-dx*dx-dz*dz;
  if(inside<.22)continue;
  const surface=.12+.72*Math.sqrt(inside);
  const w=.18+rand()*.17,h=.18+rand()*.22,d=.18+rand()*.13,rot=(rand()-.5)*.25;
  dummy.position.set(x,surface+h/2-.025,z);dummy.rotation.set(0,rot,0);dummy.scale.set(w,h,d);
  dummy.updateMatrix();houses.setMatrixAt(n,dummy.matrix);
  houses.setColorAt(n,new THREE.Color(houseColors[(rand()*houseColors.length)|0]));
  dummy.position.y=surface+h+.005;dummy.scale.set(w*1.1,.045,d*1.1);dummy.updateMatrix();
  roofs.setMatrixAt(n,dummy.matrix);roofs.setColorAt(n,new THREE.Color(n%5===0?'#88765f':'#aab1aa'));
  houseData.push({x,y:surface+h*.55,z,w,h,d,rot});n++;
}
houses.instanceMatrix.needsUpdate=true;roofs.instanceMatrix.needsUpdate=true;
houses.instanceColor.needsUpdate=true;roofs.instanceColor.needsUpdate=true;
scene.add(houses,roofs);

const windows=new THREE.InstancedMesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false}),houseData.length);
houseData.forEach((q,i)=>{
  const off=q.d/2+.008;
  dummy.position.set(q.x+Math.sin(q.rot)*off,q.y,q.z+Math.cos(q.rot)*off);
  dummy.rotation.set(0,q.rot,0);dummy.scale.set(q.w*.3,q.h*.26,1);dummy.updateMatrix();
  windows.setMatrixAt(i,dummy.matrix);
  windows.setColorAt(i,new THREE.Color(i%4===0?'#263b47':i%3===0?'#ffdba0':'#ffc173'));
});
windows.instanceMatrix.needsUpdate=true;windows.instanceColor.needsUpdate=true;
windows.castShadow=false;scene.add(windows);

scene.updateMatrixWorld(true);
const lampWorld=tower.localToWorld(new THREE.Vector3(0,6.95,0));
waterMat.uniforms.uLamp.value.set(lampWorld.x,-lampWorld.z);

const beamSweep=new THREE.Group();beamSweep.position.copy(lampWorld);scene.add(beamSweep);
const beamAim=new THREE.Group();beamAim.rotation.z=-.055;beamSweep.add(beamAim);
function beamMaterial(length,opacity){
  return new THREE.ShaderMaterial({
    uniforms:{uLength:{value:length},uOpacity:{value:opacity},uColor:{value:new THREE.Color('#ffdda3')}},
    vertexShader:`
      varying vec3 vLocal,vWorld,vN;
      void main(){
        vLocal=position;
        vec4 w=modelMatrix*vec4(position,1.0);
        vWorld=w.xyz;vN=normalize(mat3(modelMatrix)*normal);
        gl_Position=projectionMatrix*viewMatrix*w;
      }`,
    fragmentShader:`
      uniform float uLength,uOpacity;uniform vec3 uColor;
      varying vec3 vLocal,vWorld,vN;
      void main(){
        float axial=clamp((uLength*.5-vLocal.y)/uLength,0.0,1.0);
        float facing=abs(dot(normalize(vN),normalize(cameraPosition-vWorld)));
        float soft=pow(facing,1.15);
        float alpha=uOpacity*smoothstep(0.0,.025,axial)*pow(1.0-axial,1.3)*soft;
        gl_FragColor=vec4(uColor,alpha);
      }`,
    transparent:true,depthWrite:false,side:THREE.DoubleSide,
    blending:THREE.AdditiveBlending,toneMapped:false
  });
}
function addBeam(length,radius,opacity){
  const m=new THREE.Mesh(new THREE.ConeGeometry(radius,length,48,1,true),beamMaterial(length,opacity));
  m.rotation.z=Math.PI/2;m.position.x=length/2;m.renderOrder=6;
  m.castShadow=false;m.receiveShadow=false;beamAim.add(m);return m;
}
addBeam(12.5,1.85,.3);
addBeam(10.8,.68,.22);
const spot=new THREE.SpotLight(0xffd59a,160,25,.16,.75,1.5);
spot.position.set(0,0,0);spot.target.position.set(12,0,0);
beamAim.add(spot,spot.target);

function makeGlowTexture(){
  const c=document.createElement('canvas');c.width=c.height=128;
  const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.16,'rgba(255,235,190,.65)');
  g.addColorStop(.45,'rgba(255,190,100,.16)');g.addColorStop(1,'rgba(255,170,70,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const glowTex=makeGlowTexture();
const halo=new THREE.Sprite(new THREE.SpriteMaterial({
  map:glowTex,color:0xffb65c,transparent:true,opacity:.78,
  blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,toneMapped:false
}));
halo.position.copy(lampWorld);halo.scale.set(1.65,1.65,1);halo.renderOrder=20;scene.add(halo);
const core=new THREE.Sprite(new THREE.SpriteMaterial({
  map:glowTex,color:0xffe0a0,transparent:true,opacity:.95,
  blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,toneMapped:false
}));
core.position.copy(lampWorld);core.scale.set(.55,.55,1);core.renderOrder=21;scene.add(core);

scene.traverse(o=>{
  if(!o.isMesh)return;
  const ms=Array.isArray(o.material)?o.material:[o.material];
  ms.forEach(m=>{if(m.isMeshStandardMaterial)m.envMapIntensity=.24;});
});

const composer=new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio,2));
composer.addPass(new RenderPass(scene,camera));
const tilt=new ShaderPass({
  uniforms:{tDiffuse:{value:null},resolution:{value:new THREE.Vector2(innerWidth,innerHeight)}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;uniform vec2 resolution;varying vec2 vUv;
    void main(){
      float blur=smoothstep(.16,.48,abs(vUv.y-.53))*2.35;
      vec2 p=vec2(1.0)/resolution*blur;
      vec4 c=texture2D(tDiffuse,vUv)*.24;
      c+=texture2D(tDiffuse,vUv+vec2(p.x,0.0))*.12;
      c+=texture2D(tDiffuse,vUv-vec2(p.x,0.0))*.12;
      c+=texture2D(tDiffuse,vUv+vec2(0.0,p.y))*.12;
      c+=texture2D(tDiffuse,vUv-vec2(0.0,p.y))*.12;
      c+=texture2D(tDiffuse,vUv+p)*.07;
      c+=texture2D(tDiffuse,vUv-p)*.07;
      c+=texture2D(tDiffuse,vUv+vec2(p.x,-p.y))*.07;
      c+=texture2D(tDiffuse,vUv+vec2(-p.x,p.y))*.07;
      gl_FragColor=c;
    }`
});
composer.addPass(tilt);composer.addPass(new OutputPass());

function resize(){
  const w=innerWidth,h=innerHeight,pr=Math.min(devicePixelRatio,2);
  camera.aspect=w/h;camera.fov=w/h<1?46:35;camera.updateProjectionMatrix();
  renderer.setPixelRatio(pr);renderer.setSize(w,h);
  composer.setPixelRatio(pr);composer.setSize(w,h);
  tilt.uniforms.resolution.value.set(w*pr,h*pr);
}
window.addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime(),a=.65+t*.32;
  waterMat.uniforms.uTime.value=t;
  beamSweep.rotation.y=a;
  waterMat.uniforms.uBeamDir.value.set(Math.cos(a),Math.sin(a));
  crown.rotation.z=Math.sin(t*.8)*.035;
  crown.rotation.x=Math.cos(t*.63)*.018;
  lampMat.emissiveIntensity=3.15+Math.sin(t*2.1)*.22;
  glow.intensity=27+Math.sin(t*2.1)*2;
  halo.material.opacity=.72+Math.sin(t*2.1)*.06;
  beaconMat.emissiveIntensity=1.5+Math.max(0,Math.sin(t*2.4))*1.2;
  controls.update();composer.render();
}
animate();
</script>
