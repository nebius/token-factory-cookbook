function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

function makeSky(){
  const c=document.createElement('canvas');
  c.width=1024; c.height=512;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,512);
  g.addColorStop(0,'#87a8be');
  g.addColorStop(.62,'#aec0c5');
  g.addColorStop(1,'#cac3b8');
  x.fillStyle=g; x.fillRect(0,0,1024,512);
  const puff=(px,py,r,a)=>{
    const q=x.createRadialGradient(px,py,0,px,py,r);
    q.addColorStop(0,`rgba(255,250,238,${a})`);
    q.addColorStop(.48,`rgba(242,239,226,${a*.75})`);
    q.addColorStop(1,'rgba(210,211,204,0)');
    x.fillStyle=q; x.fillRect(px-r,py-r,r*2,r*2);
  };
  [[180,150,1.2],[320,185,1],[835,105,1.35],[930,175,1]].forEach(([px,py,s])=>{
    for(let i=0;i<8;i++) puff(px+(i-3.5)*29*s,py+Math.sin(i*1.7)*15*s,(62+(i%3)*18)*s,.22);
  });
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

function stoneTexture(palette,mortar,rows,cols,seed,rx=1,ry=1){
  const r=mulberry32(seed),c=document.createElement('canvas');
  c.width=c.height=512;
  const x=c.getContext('2d');
  x.fillStyle=mortar; x.fillRect(0,0,512,512);
  const rh=512/rows;
  for(let row=0;row<rows;row++){
    let xx=(row%2?-512/cols*.45:0);
    while(xx<512){
      const bw=512/cols*(.78+r()*.45);
      x.fillStyle=palette[(r()*palette.length)|0];
      x.fillRect(xx+1.5,row*rh+1.5,bw-3,rh-3);
      x.strokeStyle='rgba(255,241,211,.12)';
      x.strokeRect(xx+3,row*rh+3,bw-6,rh-6);
      xx+=bw;
    }
  }
  for(let i=0;i<1900;i++){
    x.fillStyle=r()>.5?'rgba(255,244,215,.09)':'rgba(54,38,22,.075)';
    const s=.5+r()*2;
    x.fillRect(r()*512,r()*512,s,s);
  }
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(rx,ry);
  t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());
  return t;
}

function part(geo,mat,x,y,z,parent=scene){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}
function roundedShape(w,d,r){
  const s=new THREE.Shape();
  s.moveTo(-w/2+r,-d/2);
  s.lineTo(w/2-r,-d/2);
  s.quadraticCurveTo(w/2,-d/2,w/2,-d/2+r);
  s.lineTo(w/2,d/2-r);
  s.quadraticCurveTo(w/2,d/2,w/2-r,d/2);
  s.lineTo(-w/2+r,d/2);
  s.quadraticCurveTo(-w/2,d/2,-w/2,d/2-r);
  s.lineTo(-w/2,-d/2+r);
  s.quadraticCurveTo(-w/2,-d/2,-w/2+r,-d/2);
  s.closePath();
  return s;
}
function slab(w,h,d,r,mat,y){
  const b=Math.min(.045,h*.15);
  const g=new THREE.ExtrudeGeometry(roundedShape(w,d,r),{
    depth:h,steps:1,curveSegments:10,bevelEnabled:true,
    bevelSegments:2,bevelSize:b,bevelThickness:b
  });
  g.rotateX(Math.PI/2);
  g.translate(0,h/2,0);
  return part(g,mat,0,y,0);
}
function arch(w,h,mat){
  const r=w/2,s=new THREE.Shape();
  s.moveTo(-r,-h/2);
  s.lineTo(r,-h/2);
  s.lineTo(r,h/2-r);
  s.absarc(0,h/2-r,r,0,Math.PI,false);
  s.lineTo(-r,-h/2);
  const m=new THREE.Mesh(new THREE.ShapeGeometry(s,8),mat);
  return m;
}

const waterMat=new THREE.ShaderMaterial({
  uniforms:{
    uTime:{value:0},
    uDeep:{value:new THREE.Color('#152a39')},
    uMid:{value:new THREE.Color('#354958')},
    uSky:{value:new THREE.Color('#87a8be')},
    uWarm:{value:new THREE.Color('#d5ad70')}
  },
  vertexShader:`
    uniform float uTime;
    varying vec2 vP;
    void main(){
      vP=position.xy;
      vec3 p=position;
      p.z+=sin(p.x*2.4+uTime*1.1)*.018;
      p.z+=sin(p.y*3.1-uTime*.8)*.014;
      p.z+=sin((p.x+p.y)*5.0+uTime*1.6)*.006;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
    }`,
  fragmentShader:`
    uniform float uTime;
    uniform vec3 uDeep,uMid,uSky,uWarm;
    varying vec2 vP;
    float sdRound(vec2 p,vec2 b,float r){
      vec2 q=abs(p)-b+vec2(r);
      return min(max(q.x,q.y),0.0)+length(max(q,vec2(0.0)))-r;
    }
    void main(){
      if(sdRound(vP,vec2(8.3,5.8),.72)>0.0) discard;
      float a=.5+.5*sin(vP.x*3.2+vP.y*1.4+uTime*1.2);
      float b=.5+.5*sin(vP.y*5.4-vP.x*1.8-uTime*1.45);
      float ripple=pow(max(0.0,sin(vP.y*15.0+sin(vP.x*4.0)+uTime*2.0)),9.0);
      vec3 col=mix(uDeep,uMid,.26+.38*a+.12*b);
      col=mix(col,uSky,ripple*.2);
      float reflection=exp(-abs(vP.x+1.55)*1.05)*(1.0-smoothstep(-5.2,.2,vP.y));
      float broken=pow(max(0.0,sin(vP.y*18.0+sin(vP.x*7.0)+uTime*2.2)),10.0);
      col=mix(col,uWarm,reflection*broken*.48);
      gl_FragColor=vec4(col,1.0);
    }`
});

  const dx=(x-3.5)/4.45,dz=(z+4.25)/1.25,inside=1-dx*dx-dz*dz;

  const surface=.12+.72*Math.sqrt(inside);

  dummy.position.set(x,surface+h/2-.025,z);

  dummy.position.y=surface+h+.005;
  dummy.scale.set(w*1.1,.045,d*1.1);
  dummy.updateMatrix();
  roofs.setMatrixAt(n,dummy.matrix);
  roofs.setColorAt(n,new THREE.Color(n%5===0?'#b49a76':'#d9d2c2'));
  n++;
}
houses.instanceMatrix.needsUpdate=true;
roofs.instanceMatrix.needsUpdate=true;
houses.instanceColor.needsUpdate=true;
roofs.instanceColor.needsUpdate=true;
scene.add(houses,roofs);

const composer=new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio,2));
composer.addPass(new RenderPass(scene,camera));
const tilt=new ShaderPass({
  uniforms:{tDiffuse:{value:null},resolution:{value:new THREE.Vector2(innerWidth,innerHeight)}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;
    uniform vec2 resolution;
    varying vec2 vUv;
    void main(){
      float blur=smoothstep(.16,.48,abs(vUv.y-.53))*2.35;
      vec2 p=vec2(1.0)/resolution*blur;
      vec4 c=texture2D(tDiffuse,vUv)*.24;
      c+=texture2D(tDiffuse,vUv+vec2(p.x,0.0))*.12;
      c+=texture2D(tDiffuse,vUv-vec2(p.x,0.0))*.12;
      c+=texture2D(tDiffuse,vUv+vec2(0.0,p.y))*.12;
      c+=texture2D(tDiffuse,vUv-vec2(0.0,p.y))*.12;
      c+=texture2D(tDiffuse,vUv+p)*.07;
      c+=texture2D(tDiffuse,vUv-p)*.07;
      c+=texture2D(tDiffuse,vUv+vec2(p.x,-p.y))*.07;
      c+=texture2D(tDiffuse,vUv+vec2(-p.x,p.y))*.07;
      gl_FragColor=c;
    }`
});
composer.addPass(tilt);
composer.addPass(new OutputPass());

function resize(){
  const w=innerWidth,h=innerHeight,pr=Math.min(devicePixelRatio,2);
  camera.aspect=w/h;
  camera.fov=w/h<1?46:35;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(pr);
  renderer.setSize(w,h);
  composer.setPixelRatio(pr);
  composer.setSize(w,h);
  tilt.uniforms.resolution.value.set(w*pr,h*pr);
}
window.addEventListener('resize',resize);
resize();

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  waterMat.uniforms.uTime.value=t;
  crown.rotation.z=Math.sin(t*.8)*.035;
  crown.rotation.x=Math.cos(t*.63)*.018;
  lampMat.emissiveIntensity=1.15+Math.sin(t*2.1)*.12;
  glow.intensity=2.4+Math.sin(t*2.1)*.25;
  controls.update();
  composer.render();
}
animate();
</script>
