# pnpm 11+ asks about each install script. None is needed: esbuild, sharp and @napi-rs/canvas ship prebuilt binaries.
allowBuilds:
  esbuild: false
  sharp: false
# Patched versions of Next.js's own dependencies (pnpm audit).
overrides:
  postcss: 8.5.31
  sharp: 0.35.5
  # exceljs pins uuid 8, which has an advisory; it only calls v4(), which uuid 11 keeps.
  uuid: 11.1.1
